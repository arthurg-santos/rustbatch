[workspace]
resolver = "2"
members = ["rustbatch-core", "rustbatch-ui"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Arthur"]

[workspace.dependencies]
# Núcleo
thiserror = "2.0"
image = { version = "0.25.10", features = ["avif"] }
imageproc = "0.25"
heif-rs = "26.10.3"
ab_glyph = "0.2.31"
rayon = "1.12"
tempfile = "3.20"
async-channel = "2.5"
log = "0.4"
chrono = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# UI
gtk4 = { version = "0.11", package = "gtk4", features = ["v4_10"] }
glib = { version = "0.22", package = "glib" }
gio = { version = "0.22", package = "gio" }